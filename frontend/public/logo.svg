<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Cyan to Google Blue -->
    <linearGradient id="logoBlue" x1="10" y1="10" x2="90" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#1a73e8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Indigo to Purple -->
    <linearGradient id="logoPurple" x1="15" y1="20" x2="60" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a73e8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Emerald to Teal -->
    <linearGradient id="logoEmerald" x1="85" y1="25" x2="45" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <radialGradient id="sparkCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#1a73e8" stop-opacity="0" />
    </radialGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Dynamic Cloud Drive Geometry -->
  <g>
    <!-- Cloud Contour Ribbon -->
    <path
      d="M32 38 C25 38, 18 44, 18 53 C18 62, 25 68, 33 68 L68 68 C77 68, 84 61, 84 52 C84 44, 78 37, 70 36 C68 26, 59 18, 48 18 C39 18, 32 23, 29 30"
      fill="none"
      stroke="url(#logoBlue)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Google Drive Triangular Mobius Flow (Left Facet) -->
    <path
      d="M32 30 L50 62 L38 62 L24 40 Z"
      fill="url(#logoPurple)"
    />

    <!-- Right Facet -->
    <path
      d="M68 30 L50 62 L60 80 L76 46 Z"
      fill="url(#logoEmerald)"
    />

    <!-- Base Horizon Facet -->
    <path
      d="M38 62 L64 62 L50 84 Z"
      fill="url(#logoBlue)"
    />

    <!-- Central AI Core Spark -->
    <circle cx="50" cy="50" r="12" fill="url(#sparkCenter)" />
    <circle cx="50" cy="50" r="4.5" fill="#ffffff" />

    <!-- Orbital Particles -->
    <circle cx="28" cy="50" r="2.2" fill="#60a5fa" />
    <circle cx="72" cy="50" r="2.2" fill="#34d399" />
    <circle cx="50" cy="26" r="2.2" fill="#a78bfa" />
  </g>
</svg>
