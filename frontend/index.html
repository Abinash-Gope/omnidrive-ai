<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#060b19" />
    <title>OmniDrive AI — Cloud Storage Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      window.global = window;
      window.process = window.process || { env: {} };
      (function() {
        try {
          var saved = localStorage.getItem("omnidrive_theme") || "light";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = saved === "dark" || (saved === "system" && prefersDark);
          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
            document.documentElement.setAttribute("data-theme", "dark");
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.style.colorScheme = "light";
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-google-bg text-google-text font-sans antialiased selection:bg-blue-100 selection:text-google-blue">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
